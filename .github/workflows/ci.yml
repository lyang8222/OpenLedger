name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Xcode 26+
        run: |
          set -e
          if xcodebuild -version | grep -Eq 'Xcode (2[6-9]|[3-9][0-9])'; then
            echo "Using $(xcodebuild -version | head -1)"
          else
            XCODE_PATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
            if [ -n "$XCODE_PATH" ]; then
              sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            else
              echo "未找到 Xcode 26+，当前版本：$(xcodebuild -version | head -1)"
              exit 1
            fi
          fi

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Core library tests (XCTest)
        run: swift test --package-path OpenLedgerCore

      - name: Core library checker
        run: swift run --package-path OpenLedgerCore OpenLedgerCoreCheck

      - name: Build iOS app
        run: |
          xcodebuild -project OpenLedger.xcodeproj -scheme OpenLedger \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build iOS tests
        run: |
          xcodebuild -project OpenLedger.xcodeproj -scheme OpenLedger \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing
